
name: Global Enterprise Platform Engineering CI

on:
  push:
    branches: [main, master, develop, "release/**"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.23"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.10.5"
  HELM_VERSION: "v3.16.4"
  KUBECONFORM_VERSION: "v0.6.7"

jobs:

  # ==========================================
  # 1, 2, 6, 9: SECURITY, CLOUD, ZERO TRUST
  # SAST, SECRETS, SCA, SBOM, SLSA
  # ==========================================

  security:
    name: Security, Zero Trust & Supply Chain
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      security-events: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep

      - name: SAST security audit
        run: |
          semgrep scan \
            --config p/security-audit \
            --error \
            --metrics=off \
            .

      - name: Trivy filesystem security
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true

      - name: Attest SBOM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom.cyclonedx.json

      - name: Install Cosign
        if: vars.COSIGN_IMAGE_REF != ''
        uses: sigstore/cosign-installer@v3

      - name: Verify container image signature
        if: >-
          vars.COSIGN_IMAGE_REF != '' &&
          vars.COSIGN_CERTIFICATE_IDENTITY != '' &&
          vars.COSIGN_OIDC_ISSUER != ''
        env:
          IMAGE_REF: ${{ vars.COSIGN_IMAGE_REF }}
          CERT_IDENTITY: ${{ vars.COSIGN_CERTIFICATE_IDENTITY }}
          OIDC_ISSUER: ${{ vars.COSIGN_OIDC_ISSUER }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF"

      - name: OWASP ZAP baseline scan
        if: vars.DAST_TARGET_URL != ''
        env:
          TARGET_URL: ${{ vars.DAST_TARGET_URL }}
        run: |
          docker run --rm \
            -t zaproxy/zap-stable \
            zap-baseline.py \
            -t "$TARGET_URL"

  # ==========================================
  # 1, 2: MULTI-CLOUD & TERRAFORM
  # AWS / AZURE / GOOGLE CLOUD
  # ==========================================

  multi-cloud:
    name: Multi-Cloud & Terraform Engineering
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format and module validation
        shell: bash
        run: |
          mapfile -t modules < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".terraform" \
              \) -prune -o \
              -type f -name "*.tf" -printf '%h\n' |
              sort -u
          )

          if [ "${#modules[@]}" -eq 0 ]; then
            echo "No Terraform modules found."
            exit 0
          fi

          terraform fmt -check -recursive

          for module in "${modules[@]}"; do
            echo "Validating Terraform module: $module"

            terraform -chdir="$module" init \
              -backend=false \
              -input=false \
              -no-color

            terraform -chdir="$module" validate -no-color
          done

      - name: Install Checkov
        run: |
          python -m pip install --disable-pip-version-check checkov

      - name: Multi-cloud IaC policy audit
        run: |
          checkov \
            -d . \
            --quiet \
            --compact \
            --skip-path .github

      - name: Cloud configuration inventory
        run: |
          for dir in \
            aws azure gcp \
            cloud/aws cloud/azure cloud/gcp \
            infrastructure terraform; do

            if [ -d "$dir" ]; then
              echo "Cloud configuration found: $dir"
            fi
          done

  # ==========================================
  # 3: CONTAINER ENGINEERING & SECURITY
  # DOCKER / HADOLINT / SBOM
  # ==========================================

  containers:
    name: Container Engineering & Security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dockerfile lint
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Dockerfile*" -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfiles found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Linting: $file"

            docker run --rm -i \
              hadolint/hadolint:v2.12.0 \
              < "$file"
          done

      - name: Docker build validation
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Dockerfile*" -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfiles to build."
            exit 0
          fi

          for file in "${files[@]}"; do
            context="$(dirname "$file")"
            tag="platform-ci:$(echo "$file" | sha256sum | cut -c1-12)"

            echo "Building: $file"

            docker build \
              --pull \
              -f "$file" \
              -t "$tag" \
              "$context"
          done

  # ==========================================
  # 4: KUBERNETES ENGINEERING
  # EKS / AKS / GKE / HELM
  # ==========================================

  kubernetes:
    name: Kubernetes & Helm Engineering
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kubeconform
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz \
            -C /tmp kubeconform

          sudo install /tmp/kubeconform \
            /usr/local/bin/kubeconform

          kubeconform -v

      - name: Helm lint and render
        shell: bash
        run: |
          mapfile -t charts < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Chart.yaml" -printf '%h\n' |
              sort -u
          )

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "No Helm charts found."
            exit 0
          fi

          for chart in "${charts[@]}"; do
            echo "Checking chart: $chart"

            helm lint "$chart"

            helm template platform-ci "$chart" |
              kubeconform \
                -strict \
                -ignore-missing-schemas \
                -skip CustomResourceDefinition \
                -summary
          done

      - name: Kubernetes and GitOps manifest validation
        shell: bash
        run: |
          mapfile -d '' manifests < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".github" -o \
                -name ".terraform" \
              \) -prune -o \
              -type f \
              \( \
                -path "*/k8s/*" -o \
                -path "*/kubernetes/*" -o \
                -path "*/manifests/*" -o \
                -path "*/clusters/*" -o \
                -path "*/argocd/*" -o \
                -path "*/flux/*" \
              \) \
              \( -name "*.yaml" -o -name "*.yml" \) \
              -print0
          )

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No standalone Kubernetes/GitOps manifests found."
            exit 0
          fi

          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -skip CustomResourceDefinition \
            -summary \
            "${manifests[@]}"

  # ==========================================
  # 5, 6: ENTERPRISE CI/CD & ZERO TRUST
  # ACTIONLINT / PERMISSION AUDIT
  # ==========================================

  ci-governance:
    name: Enterprise CI/CD & Workflow Security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install actionlint
        run: |
          go install \
            github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: GitHub Actions workflow validation
        run: |
          actionlint

      - name: Workflow permission audit
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".github/workflows")
          failed = False

          if not root.exists():
              print("Workflow directory not found.")
              sys.exit(1)

          for path in sorted(root.glob("*")):
              if path.suffix not in (".yml", ".yaml"):
                  continue

              content = path.read_text(encoding="utf-8")

              if re.search(
                  r"(?m)^\s*permissions:\s*write-all\s*(?:#.*)?$",
                  content
              ):
                  print(f"FAIL: Broad permissions in {path}")
                  failed = True
              else:
                  print(f"CHECKED: {path}")

          if failed:
              sys.exit(1)
          PY

  # ==========================================
  # 7, 8: RELIABILITY, DR & TESTING
  # PYTHON / GO / NODE / SHELL
  # ==========================================

  reliability-testing:
    name: Reliability, Recovery & Automated Testing
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff bandit

      - name: Python lint
        run: ruff check .

      - name: Python security analysis
        run: bandit -r . -ll -x ./.github

      - name: Python unit and integration tests
        shell: bash
        run: |
          mapfile -t tests < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".venv" -o \
                -name "venv" \
              \) -prune -o \
              -type f \
              \( -name "test_*.py" -o -name "*_test.py" \) \
              -print
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No Python tests found."
            exit 0
          fi

          pytest -v "${tests[@]}"

      - name: Setup Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go tests
        if: hashFiles('go.mod') != ''
        run: go test ./...

      - name: Setup Node.js
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node.js tests
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm test --if-present

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell script lint
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".venv" -o \
                -name "venv" \
              \) -prune -o \
              -type f -name "*.sh" -print0
          )

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          shellcheck "${scripts[@]}"

      - name: Disaster recovery test hooks
        shell: bash
        run: |
          configured=0

          for script in \
            scripts/ci/verify-backup.sh \
            scripts/ci/verify-recovery.sh; do

            if [ -f "$script" ]; then
              configured=1
              echo "Running: $script"
              bash "$script"
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "DR test scripts are not configured."
          fi

  # ==========================================
  # 10: OBSERVABILITY & MONITORING
  # PROMETHEUS / GRAFANA / OPENTELEMETRY
  # ==========================================

  observability:
    name: Observability & Monitoring
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install YAML validator
        run: |
          python -m pip install yamllint pyyaml

      - name: YAML lint
        run: |
          yamllint \
            -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            .

      - name: JSON syntax validation
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Validating: $file"
            python -m json.tool "$file" > /dev/null
          done < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name "node_modules" -o \
                -name ".terraform" \
              \) -prune -o \
              -type f -name "*.json" -print0
          )

      - name: Prometheus configuration validation
        shell: bash
        run: |
          mapfile -t configs < <(
            find . \
              -type d -name ".git" -prune -o \
              -type f \
              \( \
                -name "prometheus.yml" -o \
                -name "prometheus.yaml" \
              \) \
              -print
          )

          if [ "${#configs[@]}" -eq 0 ]; then
            echo "No Prometheus configuration found."
            exit 0
          fi

          for config in "${configs[@]}"; do
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              prom/prometheus:v3.0.1 \
              promtool check config "$config"
          done

      - name: Monitoring inventory
        run: |
          for dir in \
            prometheus \
            grafana \
            observability \
            monitoring \
            opentelemetry; do

            if [ -d "$dir" ]; then
              echo "Found monitoring component: $dir"
            fi
          done

  # ==========================================
  # 11, 12: PLATFORM ENGINEERING & AI
  # BACKSTAGE / PYTHON AUTOMATION
  # ==========================================

  platform-ai:
    name: Platform Engineering & AI Automation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install platform validation tools
        run: |
          python -m pip install ruff bandit pytest pyyaml

      - name: Platform Python code validation
        run: |
          ruff check .
          bandit -r . -ll -x ./.github
          python -m compileall -q .

      - name: AI and automation component discovery
        shell: bash
        run: |
          for dir in \
            ai \
            automation \
            cloud-automation \
            platform \
            backstage; do

            if [ -d "$dir" ]; then
              echo "Component found: $dir"
            fi
          done

      - name: Backstage catalog validation
        shell: bash
        run: |
          mapfile -t catalog_files < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".terraform" \
              \) -prune -o \
              -type f -name "catalog-info.yaml" -print
          )

          if [ "${#catalog_files[@]}" -eq 0 ]; then
            echo "No Backstage catalog descriptors found."
            exit 0
          fi

          python - "${catalog_files[@]}" <<'PY'
          import pathlib
          import sys
          import yaml

          for name in sys.argv[1:]:
              path = pathlib.Path(name)

              with path.open(encoding="utf-8") as file:
                  data = yaml.safe_load(file)

              if not isinstance(data, dict):
                  raise ValueError(f"Invalid catalog descriptor: {path}")

              if not isinstance(data.get("apiVersion"), str):
                  raise ValueError(f"Missing apiVersion: {path}")

              if not isinstance(data.get("kind"), str):
                  raise ValueError(f"Missing kind: {path}")

              if not isinstance(data.get("metadata"), dict):
                  raise ValueError(f"Missing metadata: {path}")

              print(f"Catalog structure valid: {path}")
          PY

  # ==========================================
  # FINAL ENTERPRISE PIPELINE GATE
  # ALL EIGHT ENGINEERING JOBS REQUIRED
  # ==========================================

  final-status:
    name: Final Enterprise CI Status
    runs-on: ubuntu-latest

    needs:
      - security
      - multi-cloud
      - containers
      - kubernetes
      - ci-governance
      - reliability-testing
      - observability
      - platform-ai

    if: always()

    permissions: {}

    steps:
      - name: Verify all engineering pillars
        shell: bash
        env:
          SECURITY: ${{ needs.security.result }}
          CLOUD: ${{ needs.multi-cloud.result }}
          CONTAINERS: ${{ needs.containers.result }}
          KUBERNETES: ${{ needs.kubernetes.result }}
          GOVERNANCE: ${{ needs.ci-governance.result }}
          RELIABILITY: ${{ needs.reliability-testing.result }}
          OBSERVABILITY: ${{ ne
