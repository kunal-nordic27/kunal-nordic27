
name: Global Enterprise Platform Engineering CI

on:
  push:
    branches: [main, master, develop, "release/**"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.10.5"
  HELM_VERSION: "3.16.4"
  KUBECONFORM_VERSION: "v0.6.7"

jobs:

  # ==========================================
  # 1. CLOUD & TERRAFORM
  # ==========================================

  cloud-terraform:
    name: Cloud & Terraform (AWS, Azure, GCP)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Discover Terraform modules
        id: terraform-modules
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t modules < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "*.tf" -printf '%h\n' |
              sort -u
          )

          printf '%s\n' "${modules[@]}" > /tmp/tf-modules.txt

          echo "Terraform modules found: ${#modules[@]}"
          printf '%s\n' "${modules[@]}"

      - name: Terraform formatting
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s /tmp/tf-modules.txt ]; then
            echo "No Terraform files found. Skipping."
            exit 0
          fi

          terraform fmt -recursive

      - name: Terraform initialization and validation
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r module; do
            [ -n "$module" ] || continue

            echo "================================="
            echo "Validating: $module"
            echo "================================="

            terraform -chdir="$module" init \
              -backend=false \
              -input=false \
              -no-color

            terraform -chdir="$module" validate -no-color

            echo "PASS: $module"
          done < /tmp/tf-modules.txt

          echo "Terraform validation completed."

  # ==========================================
  # 2. DOCKER / KUBERNETES / HELM
  # ==========================================

  containers-kubernetes:
    name: Docker, Kubernetes & Helm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Docker build verification
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Dockerfile*" -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfiles found. Skipping."
            exit 0
          fi

          for file in "${files[@]}"; do
            context="$(dirname "$file")"
            tag="platform-ci:$(printf '%s' "$file" | sha256sum | cut -c1-12)"

            echo "Building: $file"
            docker build -f "$file" -t "$tag" "$context"
          done

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kubeconform
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz \
            -C /tmp kubeconform

          sudo install /tmp/kubeconform \
            /usr/local/bin/kubeconform

          kubeconform -v

      - name: Helm lint and Kubernetes manifest validation
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t charts < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Chart.yaml" -printf '%h\n' |
              sort -u
          )

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "No Helm charts found. Skipping."
            exit 0
          fi

          for chart in "${charts[@]}"; do
            echo "Checking chart: $chart"

            helm lint "$chart"

            helm template platform-ci "$chart" |
              kubeconform \
                -strict \
                -ignore-missing-schemas \
                -skip CustomResourceDefinition \
                -summary
          done

  # ==========================================
  # 3. SECURITY / ZERO TRUST
  # ==========================================

  security-zero-trust:
    name: Security, OIDC, IAM/RBAC, Semgrep, Trivy & Cosign
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Workflow permissions audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".github/workflows")

          if not root.exists():
              print("No workflow directory found.")
              sys.exit(0)

          failed = False

          for path in sorted(root.iterdir()):
              if not path.is_file():
                  continue

              if path.suffix not in (".yml", ".yaml"):
                  continue

              content = path.read_text(encoding="utf-8")

              if re.search(
                  r"(?m)^\s*permissions:\s*write-all\s*(?:#.*)?$",
                  content
              ):
                  print(f"FAIL: Broad permissions in {path}")
                  failed = True
              else:
                  print(f"PASS: {path}")

          if failed:
              sys.exit(1)
          PY

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check semgrep

      - name: Semgrep security scan
        run: |
          semgrep scan --config p/ci --metrics=off .

      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Install Cosign
        if: ${{ vars.COSIGN_IMAGE_REF != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Verify container signature
        if: >-
          vars.COSIGN_IMAGE_REF != '' &&
          vars.COSIGN_CERTIFICATE_IDENTITY != '' &&
          vars.COSIGN_OIDC_ISSUER != ''
        env:
          IMAGE_REF: ${{ vars.COSIGN_IMAGE_REF }}
          CERT_IDENTITY: ${{ vars.COSIGN_CERTIFICATE_IDENTITY }}
          OIDC_ISSUER: ${{ vars.COSIGN_OIDC_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail

          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF"

  # ==========================================
  # 4. OBSERVABILITY / PYTHON / BACKSTAGE
  # ==========================================

  observability-platform-python:
    name: Prometheus, Grafana, OpenTelemetry, Backstage & Python
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python syntax validation
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            -x '(\.git|\.venv|venv|\.terraform|__pycache__)' .

      - name: Python unit tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tests < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".venv" -o \
                -name "venv" -o \
                -name ".terraform" -o \
                -name "__pycache__" \
              \) -prune -o \
              -type f \( \
                -name "test_*.py" -o \
                -name "*_test.py" \
              \) -print
          )

          if [ "${#tests[@]}" -gt 0 ]; then
            python -m pip install --disable-pip-version-check pytest
            pytest -v "${tests[@]}"
          else
            echo "No Python tests found. Skipping."
          fi

      - name: Install YAML validation dependency
        run: |
          python -m pip install --disable-pip-version-check pyyaml

      - name: Backstage catalog validation
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t catalog_files < <(
            find . \
              -type d \( \
                -name ".git" -o \
                -name ".terraform" -o \
                -name ".venv" -o \
                -name "venv" \
              \) -prune -o \
              -type f -name "catalog-info.yaml" -print
          )

          if [ "${#catalog_files[@]}" -eq 0 ]; then
            echo "No Backstage catalog files found. Skipping."
            exit 0
          fi

          python - "${catalog_files[@]}" <<'PY'
          import pathlib
          import sys
          import yaml

          for raw in sys.argv[1:]:
              path = pathlib.Path(raw)

              data = yaml.safe_load(
                  path.read_text(encoding="utf-8")
              )

              if (
                  not isinstance(data, dict)
                  or not data.get("apiVersion")
                  or not data.get("kind")
                  or not isinstance(data.get("metadata"), dict)
              ):
                  raise ValueError(
                      f"Invalid Backstage descriptor: {path}"
                  )

              print(f"PASS: {path}")
          PY

      - name: Observability platform inventory
        shell: bash
        run: |
          set -euo pipefail

          for dir in \
            prometheus \
            grafana \
            otel \
            opentelemetry \
            monitoring \
            observability \
            backstage
          do
            if [ -d "$dir" ]; then
              echo "Found: $dir"
              find "$dir" -maxdepth 3 -type f
            fi
          done

  # ==========================================
  # 5. FINAL CI PASS GATE
  # ==========================================

  pipeline-gate:
    name: Final CI Pass Gate
    runs-on: ubuntu-latest

    needs:
      - cloud-terraform
      - containers-kubernetes
      - security-zero-trust
      - observability-platform-python

    if: always()

    permissions: {}

    steps:
      - name: Verify all platform engineering jobs
        shell: bash
        env:
          JOB_CLOUD: ${{ needs.cloud-terraform.result }}
          JOB_K8S: ${{ needs.containers-kubernetes.result }}
          JOB_SEC: ${{ needs.security-zero-trust.result }}
          JOB_OBS: ${{ needs.observability-platform-python.result }}
        run: |
          set -euo pipefail

          failed=0

          for item in \
            "Cloud Terraform:$JOB_CLOUD" \
            "Docker Kubernetes Helm:$JOB_K8S" \
            "Security Zero Trust:$JOB_SEC" \
            "Observability Python:$JOB_OBS"
          do
            name="${item%%:*}"
            result="${item#*:}"

            echo "$name => $result"

            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "================================"
            echo "GLOBAL PLATFORM CI: FAILED"
            echo "================================"
            exit 1
          fi

          echo "================================"
          echo "GLOBAL PLATFORM CI: PASSED"
          echo "ALL JOBS SUCCESSFUL"
          echo "================================"
          
