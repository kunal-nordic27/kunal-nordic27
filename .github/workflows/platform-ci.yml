name: Global Enterprise Platform Engineering CI

on:
  push:
    branches: [main, master, develop, "release/**"]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.10.5"
  HELM_VERSION: "v3.16.4"
  KUBECONFORM_VERSION: "v0.6.7"

jobs:
  cloud-terraform:
    name: Cloud & Terraform (AWS, Azure, GCP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format and validate Terraform modules
        shell: bash
        run: |
          mapfile -t modules < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "*.tf" -printf '%h\n' |
              sort -u
          )

          if [ "${#modules[@]}" -eq 0 ]; then
            echo "No Terraform (*.tf) files found yet. Skipping Terraform validation."
            exit 0
          fi

          terraform fmt -recursive

          for module in "${modules[@]}"; do
            echo "=== Validating Terraform module: $module ==="
            terraform -chdir="$module" init -backend=false -input=false -no-color
            terraform -chdir="$module" validate -no-color
          done

  containers-kubernetes:
    name: Docker, Kubernetes & Helm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build check
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Dockerfile*" -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Dockerfiles found yet. Skipping Docker build."
            exit 0
          fi

          for file in "${files[@]}"; do
            context="$(dirname "$file")"
            tag="platform-ci:$(printf '%s' "$file" | sha256sum | cut -c1-12)"
            echo "=== Building image from: $file ==="
            docker build -f "$file" -t "$tag" "$context"
          done

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Kubeconform
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint and render check
        shell: bash
        run: |
          mapfile -t charts < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" \) -prune -o \
              -type f -name "Chart.yaml" -printf '%h\n' |
              sort -u
          )

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "No Helm charts (Chart.yaml) found yet. Skipping Helm check."
            exit 0
          fi

          for chart in "${charts[@]}"; do
            echo "=== Linting and rendering chart: $chart ==="
            helm lint "$chart"
            helm template platform-ci "$chart" |
              kubeconform -strict -ignore-missing-schemas -skip CustomResourceDefinition -summary
          done

  security-zero-trust:
    name: Security, OIDC, IAM/RBAC, Semgrep, Trivy & Cosign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Workflow permissions & OIDC readiness audit
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".github/workflows")
          if not root.exists():
              print("No .github/workflows directory found.")
              sys.exit(0)

          failed = False
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.suffix not in (".yml", ".yaml"):
                  continue
              content = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^\s*permissions:\s*write-all\s*(?:#.*)?$", content):
                  print(f"FAIL: Overly broad permissions in {path}")
                  failed = True
              else:
                  print(f"OK: {path}")

          if failed:
              sys.exit(1)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Semgrep security scan
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep scan --config p/ci --metrics=off .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Install Cosign (when configured)
        if: vars.COSIGN_IMAGE_REF != ''
        uses: sigstore/cosign-installer@v3

      - name: Verify container signature (when configured)
        if: >-
          vars.COSIGN_IMAGE_REF != '' &&
          vars.COSIGN_CERTIFICATE_IDENTITY != '' &&
          vars.COSIGN_OIDC_ISSUER != ''
        env:
          IMAGE_REF: ${{ vars.COSIGN_IMAGE_REF }}
          CERT_IDENTITY: ${{ vars.COSIGN_CERTIFICATE_IDENTITY }}
          OIDC_ISSUER: ${{ vars.COSIGN_OIDC_ISSUER }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE_REF"

  observability-platform-python:
    name: Prometheus, Grafana, OpenTelemetry, Backstage & Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python syntax & unit tests check
        shell: bash
        run: |
          python -m compileall -q -x '(\.git|\.venv|venv|\.terraform|__pycache__)' .
          mapfile -t tests < <(
            find . \
              -type d \( -name ".git" -o -name ".venv" -o -name "venv" -o -name ".terraform" -o -name "__pycache__" \) -prune -o \
              -type f \( -name "test_*.py" -o -name "*_test.py" \) \
              -print
          )
          if [ "${#tests[@]}" -gt 0 ]; then
            python -m pip install --disable-pip-version-check pytest
            pytest -v "${tests[@]}"
          else
            echo "No Python test files found yet. Bytecode compile check passed."
          fi

      - name: Backstage catalog validation
        shell: bash
        run: |
          mapfile -t catalog_files < <(
            find . \
              -type d \( -name ".git" -o -name ".terraform" -o -name ".venv" \) -prune -o \
              -type f -name "catalog-info.yaml" -print
          )

          if [ "${#catalog_files[@]}" -eq 0 ]; then
            echo "No catalog-info.yaml found yet. Skipping Backstage check."
            exit 0
          fi

          python -m pip install --disable-pip-version-check pyyaml

          python - "${catalog_files[@]}" <<'PY'
          import pathlib
          import sys
          import yaml

          for raw in sys.argv[1:]:
              path = pathlib.Path(raw)
              data = yaml.safe_load(path.read_text(encoding="utf-8"))

              if (
                  not isinstance(data, dict)
                  or not data.get("apiVersion")
                  or not data.get("kind")
                  or not isinstance(data.get("metadata"), dict)
              ):
                  raise ValueError(f"Invalid Backstage descriptor: {path}")

              print(f"Valid Backstage catalog: {path}")
          PY

      - name: Observability & platform inventory check
        shell: bash
        run: |
          for dir in prometheus grafana otel opentelemetry monitoring observability backstage; do
            if [ -d "$dir" ]; then
              echo "Found directory: $dir"
              find "$dir" -maxdepth 3 -type f
            fi
          done

  pipeline-gate:
    name: Final CI Pass Gate
    runs-on: ubuntu-latest
    needs:
      - cloud-terraform
      - containers-kubernetes
      - security-zero-trust
      - observability-platform-python
    if: always()
    permissions: {}
    steps:
      - name: Verify all jobs passed
        shell: bash
        env:
          JOB_CLOUD: ${{ needs.cloud-terraform.result }}
          JOB_K8S: ${{ needs.containers-kubernetes.result }}
          JOB_SEC: ${{ needs.security-zero-trust.result }}
          JOB_OBS: ${{ needs.observability-platform-python.result }}
        run: |
          failed=0
          for name_val in "Cloud:$JOB_CLOUD" "ContainersK8s:$JOB_K8S" "Security:$JOB_SEC" "ObservabilityPlatform:$JOB_OBS"; do
            key="${name_val%%:*}"
            val="${name_val#*:}"
            echo "$key => $val"
            if [ "$val" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "CI FAILED"
            exit 1
          fi

          echo "CI PASSED"
          
